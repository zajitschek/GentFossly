<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENT FOSSLY</title>
  
  <!-- External CSS Link -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="scene">
  <div class="cube" id="cube">
    
    <!-- FRONT / ABOUT FACE -->
    <div class="face front">
      <div class="face-preview">ABOUT</div>
      <div class="face-content">
        <h2>ABOUT</h2>
        <p>THIS IS ABOUT WHO GENT FOSSLY IS</p>
      </div>
    </div>

    <!-- OTHER FACES -->
    <div class="face back">
      <div class="face-preview">PROJECTS</div>
      <div class="face-content">
        <h2>PROJECTS</h2>
        <p>FEATURED WORKS HERE</p>
      </div>
    </div>

    <div class="face right">
      <div class="face-preview">CONTACT</div>
      <div class="face-content">
        <h2>CONTACT</h2>
        <p>GET IN TOUCH VIA SOCIALS OR EMAIL</p>
      </div>
    </div>

    <div class="face left">
      <div class="face-preview">THOUGHTS</div>
      <div class="face-content">
        <h2>THOUGHTS</h2>
        <p>ON NATURE, MECHANICS, CULTURE</p>
      </div>
    </div>

    <div class="face top">
      <div class="face-preview">LAB</div>
      <div class="face-content">
        <h2>LAB</h2>
        <p>ANYTHING ELSE?</p>
      </div>
    </div>

    <div class="face bottom">
      <div class="face-preview">FUTURE</div>
      <div class="face-content">
        <h2>FUTURE</h2>
        <p>IDEAS</p>
      </div>
    </div>

  </div>
</div>

<!-- GSAP Core CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  
  <!-- External JS Script Link -->
  <script src="script.js"></script>

</body>
</html>
